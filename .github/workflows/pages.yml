name: Deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取上游快照
        run: node _tools/fetch-upstream.mjs --write
      - name: 提交快照
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/js/data.js site/server/seed.json
          if git diff --staged --quiet; then
            echo '数据无变化，跳过提交'
          else
            git commit -m 'chore(data): refresh upstream snapshot'
            git push
          fi

  build:
    needs: refresh
    if: always() && needs.refresh.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 每次部署前重新生成首屏静态卡片、全量 JSON-LD 与 noscript 目录，
      # 保证快照数据（refresh 刚提交的 data.js）和 HTML 里的内容不会脱节
      - name: 预渲染首屏卡片与全量 SEO 数据
        run: node _tools/prerender.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: [refresh, build]
    # push 事件里 refresh 是 skipped，不加这个 if 的话 deploy 会跟着被跳过（GitHub 沿 needs 链传播 skipped）
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
